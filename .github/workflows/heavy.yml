name: 무거운 시험 (주 1회·수동)

on:
  schedule:
    - cron: "17 18 * * 0"   # 한국 시간 월요일 03:17
  workflow_dispatch:

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TEST_OUT: ${{ github.workspace }}/test_out
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 6.4만㎡ 큰 대지
        run: python tests/t11_huge.py
      - name: 구역별 방향
        run: python tests/t12_zones.py sample user
      - name: 일방통행·경사로 검사
        run: python tests/t13_oneway.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: 무거운시험결과
          path: test_out/
